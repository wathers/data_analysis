m.random() < 0.06 else random.randint(1, 20)\n    unit_price = '' if random.random() < 0.06 else round(random.uniform(5, 5000), 2)\n\n    # total: sometimes missing, sometimes NaN string\n    if isinstance(qty, int) and isinstance(unit_price, float):\n        total = round(qty * unit_price, 2)\n        if random.random() < 0.06:\n            total = random.choice(nan_strs)  # replace with NaN string\n    else:\n        total = random.choice(nan_strs) if random.random() < 0.5 else ''\n\n    region = '' if random.random() < 0.05 else random.choice(regions)\n    status = random.choices(statuses, weights=status_weights, k=1)[0]\n    customer = random.choice(first_names) + random.choice(['先生','女士',''])\n    if random.random() < 0.04:\n        customer = ''\n\n    rows.append([order_id, date_str, customer, region, cat, prod, \n                 qty, unit_price, total, status])\n\nwith open('mock_data_missing.csv', 'w', newline='', encoding='utf-8-sig') as f:\n    w = csv.writer(f)\n    w.writerow(['order_id','date','customer','region','category','product',\n                'quantity','unit_price','total','status'])\n    w.writerows(rows)\n\n# quick stats\nnan_like = sum(1 for r in rows for v in r if v in nan_strs)\nempty_cols = sum(1 for r in rows for v in r if v == '')\nprint(f'Done: {len(rows)} rows → mock_data_missing.csv')\nprint(f'  NaN-like strings (None/NaN/NA/null): {nan_like}')\nprint(f'  Empty strings: {empty_cols}')\nprint(f'  Total missing-ish cells: {nan_like + empty_cols}')\n\")", "Bash(grep -n 'None\\|NAN\\|NaN\\|nan\\|NA\\|null\\|^[^,]*,[^,]*,[^,]*,[^,]*,[^,]*,[^,]*,[^,]*,[^,]*,,\\|^[^,]*,[^,]*,[^,]*,[^,]*,[^,]*,,,' /Users/chenhao/PyCharmMiscProject/mock_data_missing.csv | head -15)", "Bash(cd /Users/chenhao/PyCharmMiscProject && python3 -c \"\nimport csv, random, datetime\n\nrandom.seed(99)\n\ncities = ['北京','上海','广州','深圳','杭州','成都','武汉','南京','西安','重庆',\n          '厦门','青岛','大连','昆明','哈尔滨','长沙','郑州','苏州','天津','三亚']\nweather_conds = ['晴','多云','阴','小雨','中雨','大雨','雷阵雨','小雪','雾','霾']\nwind_dirs = ['北风','东北风','东风','东南风','南风','西南风','西风','西北风']\nnan_strs = ['', 'None', 'NAN', 'NaN', 'nan', 'NA', 'null']\n\ndef maybe_nan(value, prob=0.15):\n    \\\"\\\"\\\"Randomly replace value with a NaN-like string\\\"\\\"\\\"\n    if random.random() < prob:\n        return random.choice(nan_strs)\n    return value\n\nbase_date = datetime.date(2025, 1, 1)\n\nrows = []\nfor i in range(1, 101):\n    d = base_date + datetime.timedelta(days=random.randint(0, 330))\n    date_str = maybe_nan(d.strftime('%Y-%m-%d'), 0.05)\n    city = random.choice(cities)\n    time = f'{random.randint(0,23):02d}:00'\n\n    # Temperature: -10 ~ 38, high NaN chance\n    temp = maybe_nan(round(random.uniform(-10, 38), 1), 0.18)\n\n    # Feels like temp\n    feels_like = maybe_nan(round(random.uniform(-15, 42), 1), 0.22)\n\n    # Humidity: 20% ~ 100%\n    humidity = maybe_nan(random.randint(20, 100), 0.16)\n\n    # Wind speed: 0 ~ 25 m/s (different NaN styles)\n    wind_speed = maybe_nan(round(random.uniform(0, 25), 1), 0.20)\n\n    # Wind direction\n    wind_dir = maybe_nan(random.choice(wind_dirs), 0.25)\n\n    # Gust speed\n    gust = maybe_nan(round(random.uniform(2, 40), 1), 0.30)\n\n    # Visibility: 0.5 ~ 20 km\n    visibility = maybe_nan(round(random.uniform(0.5, 20), 1), 0.12)\n\n    # Air pressure: 980 ~ 1040 hPa\n    pressure = maybe_nan(round(random.uniform(980, 1040), 1), 0.14)\n\n    # Precipitation: 0 ~ 50 mm\n    precip = maybe_nan(round(random.uniform(0, 50), 1), 0.28)\n\n    # UV index: 0 ~ 12\n    uv = maybe_nan(random.randint(0, 12), 0.26)\n\n    # AQI\n    aqi = maybe_nan(random.randint(15, 300), 0.20)\n\n    # Weather condition\n    condition = maybe_nan(random.choice(weather_conds), 0.10)\n\n    rows.append([date_str, city, time, temp, feels_like, humidity,\n                 wind_speed, wind_dir, gust, visibility, pressure,\n                 precip, uv, aqi, condition])\n\nwith open('mock_weather_data.csv', 'w', newline='', encoding='utf-8-sig') as f:\n    w = csv.writer(f)\n    w.writerow(['date','city','time','temperature_c','feels_like_c','humidity_pct',\n                'wind_speed_ms','wind_direction','gust_speed_ms','visibility_km',\n                'pressure_hpa','precipitation_mm','uv_index','aqi','condition'])\n    w.writerows(rows)\n\n# Stats\ntotal_cells = len(rows) * 15\nnan_like = sum(1 for r in rows for v in r if v in nan_strs)\nempty = sum(1 for r in rows for v in r if v == '')\nprint(f'Done: {len(rows)} rows × 15 cols → mock_weather_data.csv')\nprint(f'  Total cells: {total_cells}')\nprint(f'  Missing cells: {nan_like + empty} ({(nan_like+empty)/total_cells*100:.1f}%)')\nprint(f'    NaN-like strings: {nan_like}')\nprint(f'    Empty strings: {empty}')\n\")", "Bash(head -8 /Users/chenhao/PyCharmMiscProject/mock_weather_data.csv && echo \"---\" && grep -c 'None\\|NAN\\|NaN\\|nan\\|NA\\|null\\|,,' /Users/chenhao/PyCharmMiscProject/mock_weather_data.csv)", "Bash(python3 -c \"\nimport random, csv\n\n# 设置随机种子使结果可复现\nrandom.seed(42)\n\ndepartments = ['技术部', '市场部', '销售部', '财务部', '人事部', '运营部', '产品部', '行政部']\nsurnames = ['张', '李', '王', '赵', '刘', '陈', '杨', '黄', '周', '吴', '徐', '孙', '马', '朱', '胡', '林', '郭', '何', '高', '罗']\nnames = ['伟', '芳', '娜', '敏', '静', '丽', '强', '磊', '洋', '艳', '勇', '军', '杰', '娟', '涛', '明', '超', '秀英', '华', '慧']\n\nrows = []\nfor i in range(1, 51):\n    emp_id = f'EMP{i:04d}'\n    name = random.choice(surnames) + random.choice(names)\n    # 避免太多重复名，偶尔加双字名\n    if random.random() < 0.3:\n        name = random.choice(surnames) + random.choice(names) + random.choice(names)\n    dept = random.choice(departments)\n    salary = random.randint(3000, 30000)\n    rows.append([emp_id, name, dept, salary])\n\n# 按部门排序\nrows.sort(key=lambda r: (r[2], r[0]))\n\nwith open('employees_salary.csv', 'w', newline='', encoding='utf-8-sig') as f:\n    writer = csv.writer(f)\n    writer.writerow(['员工编号', '姓名', '部门', '工资(元)'])\n    writer.writerows(rows)\n\nprint(f'已生成 {len(rows)} 条员工工资记录')\nprint('---')\nwith open('employees_salary.csv', 'r', encoding='utf-8-sig') as f:\n    print(f.read())\n\")", "Bash(python3 -c \"\nimport random, csv\n\nrandom.seed(2024)\n\nspecies_list = ['Adelie', 'Chinstrap', 'Gentoo']\nisland_map = {\n    'Adelie': ['Torgersen', 'Biscoe', 'Dream'],\n    'Chinstrap': ['Dream'],\n    'Gentoo': ['Biscoe']\n}\nsex_list = ['MALE', 'FEMALE']\n\nparams = {\n    'Adelie': {\n        'bill_length_mm': (38.8, 2.7),\n        'bill_depth_mm': (18.3, 1.2),\n        'flipper_length_mm': (190, 6.5),\n        'body_mass_g': (3700, 450),\n    },\n    'Chinstrap': {\n        'bill_length_mm': (48.8, 3.3),\n        'bill_depth_mm': (18.4, 1.1),\n        'flipper_length_mm': (196, 7),\n        'body_mass_g': (3730, 380),\n    },\n    'Gentoo': {\n        'bill_length_mm': (47.5, 3.1),\n        'bill_depth_mm': (15.0, 1.0),\n        'flipper_length_mm': (217, 6.2),\n        'body_mass_g': (5080, 500),\n    },\n}\n\nnest_types = ['岩石', '卵石', '沙地', '草地']\n\nrows = []\nnan_counts = {col: 0 for col in ['性别', '喙长_mm', '喙深_mm', '鳍肢长_mm', '体重_g', '窝卵数', '巢穴类型', '年龄_岁']}\n\nfor i in range(1, 501):\n    pid = f'PG{i:04d}'\n    species = random.choices(species_list, weights=[0.45, 0.20, 0.35])[0]\n    island = random.choice(island_map[species])\n    sex = random.choice(sex_list)\n\n    p = params[species]\n    bill_len = round(random.gauss(p['bill_length_mm'][0], p['bill_length_mm'][1]), 1)\n    bill_dep = round(random.gauss(p['bill_depth_mm'][0], p['bill_depth_mm'][1]), 1)\n    flipper = round(random.gauss(p['flipper_length_mm'][0], p['flipper_length_mm'][1]))\n    mass = round(random.gauss(p['body_mass_g'][0], p['body_mass_g'][1]))\n\n    bill_len = max(30, min(60, bill_len))\n    bill_dep = max(12, min(22, bill_dep))\n    flipper = max(170, min(240, flipper))\n    mass = max(2500, min(6500, mass))\n    clutch_size = random.choices([1, 2, 3], weights=[0.15, 0.75, 0.10])[0]\n    nest_type = random.choice(nest_types)\n    age_years = round(random.uniform(2, 15), 1)\n\n    # 各字段约 3%-6% 概率为 NaN\n    if random.random() < 0.04:\n        sex = 'NaN'\n        nan_counts['性别'] += 1\n    if random.random() < 0.05:\n        bill_len = 'NaN'\n        nan_counts['喙长_mm'] += 1\n    if random.random() < 0.05:\n        bill_dep = 'NaN'\n        nan_counts['喙深_mm'] += 1\n    if random.random() < 0.05:\n        flipper = 'NaN'\n        nan_counts['鳍肢长_mm'] += 1\n    if random.random() < 0.06:\n        mass = 'NaN'\n        nan_counts['体重_g'] += 1\n    if random.random() < 0.03:\n        clutch_size = 'NaN'\n        nan_counts['窝卵数'] += 1\n    if random.random() < 0.03:\n        nest_type = 'NaN'\n        nan_counts['巢穴类型'] += 1\n    if random.random() < 0.05:\n        age_years = 'NaN'\n        nan_counts['年龄_岁'] += 1\n\n    rows.append([pid, species, island, sex, bill_len, bill_dep, flipper, mass, clutch_size, nest_type, age_years])\n\nwith open('penguins_data.csv', 'w', newline='', encoding='utf-8-sig') as f:\n    writer = csv.writer(f)\n    writer.writerow(['编号', '物种', '岛屿', '性别', '喙长_mm', '喙深_mm', '鳍肢长_mm', '体重_g', '窝卵数', '巢穴类型', '年龄_岁'])\n    writer.writerows(rows)\n\nprint(f'✅ 已生成 {len(rows)} 条企鹅数据 → penguins_data.csv')\nprint()\nprint('🔢 NaN 分布统计:')\nfor col, cnt in nan_counts.items():\n    print(f'   {col}: {cnt} 个 ({cnt/5:.0f}%)')\nprint(f'   总计 NaN 单元格: {sum(nan_counts.values())} 个')\nprint()\nprint('📋 前8条预览:')\nwith open('penguins_data.csv', 'r', encoding='utf-8-sig') as f:\n    for i, line in enumerate(f):\n        if i <= 8:\n            print('   ', line.rstrip())\n\")", "Bash(python3 -c \"\nimport random, csv\n\nrandom.seed(42)\n\n# 配置\nN = 500\n\nsex_list = ['男', '女']\noccupations = ['学生', 'IT/互联网', '金融', '教育', '医疗', '制造业', '公务员', '自由职业', '销售', '设计']\nsleep_quality_desc = ['极差', '较差', '一般', '良好', '优秀']\nexercise_freq = ['从不', '1-2次', '3-4次', '5次以上']\ndisorder_list = ['无', '失眠', '睡眠呼吸暂停', '不安腿综合征', '昼夜节律紊乱']\nbedtime_range = ['21:30-22:30', '22:30-23:30', '23:30-00:30', '00:30-01:30', '01:30之后']\n\nnan_cols = {\n    '年龄': 0.03,\n    '睡眠时长_小时': 0.04,\n    '睡眠质量评分_1_10': 0.04,\n    '入睡时间': 0.03,\n    '起床时间': 0.03,\n    '午睡时长_分钟': 0.05,\n    '运动频率': 0.04,\n    '咖啡因_杯_天': 0.05,\n    '压力水平_1_10': 0.04,\n    '屏幕时间_睡前_小时': 0.05,\n    'BMI': 0.06,\n}\n\nnan_counts = {k: 0 for k in nan_cols}\n\nrows = []\nfor i in range(1, N + 1):\n    sid = f'S{i:04d}'\n    sex = random.choice(sex_list)\n    age = random.randint(18, 65)\n\n    # 睡眠时长与年龄相关：年轻人睡得少(熬夜)或多(补觉)，中年人偏少\n    if age < 25:\n        sleep_hours = round(random.gauss(6.8, 1.5), 1)\n    elif age < 40:\n        sleep_hours = round(random.gauss(7.0, 1.2), 1)\n    else:\n        sleep_hours = round(random.gauss(6.5, 1.3), 1)\n    sleep_hours = round(max(3.0, min(10.0, sleep_hours)), 1)\n\n    # 入睡时间\n    bedtime = random.choices(bedtime_range, weights=[0.10, 0.30, 0.35, 0.18, 0.07])[0]\n    # 起床时间根据入睡时间推算\n    if bedtime.startswith('21'):\n        wakeup = random.choice(['05:30-06:30', '06:30-07:30'])\n    elif bedtime.startswith('22'):\n        wakeup = random.choice(['06:00-07:00', '07:00-08:00'])\n    elif bedtime.startswith('23'):\n        wakeup = random.choice(['06:30-07:30', '07:30-08:30', '08:30-09:30'])\n    else:\n        wakeup = random.choice(['07:30-08:30', '08:30-09:30', '09:30之后'])\n\n    # 睡眠质量与睡眠时长相关\n    if sleep_hours < 5:\n        quality = random.choices([1, 2, 3, 4, 5], weights=[0.25, 0.30, 0.25, 0.15, 0.05])[0]\n    elif sleep_hours < 6.5:\n        quality = random.choices([1, 2, 3, 4, 5], weights=[0.10, 0.20, 0.35, 0.25, 0.10])[0]\n    elif sleep_hours <= 8:\n        quality = random.choices([1, 2, 3, 4, 5], weights=[0.02, 0.08, 0.20, 0.40, 0.30])[0]\n    else:\n        quality = random.choices([1, 2, 3, 4, 5], weights=[0.05, 0.10, 0.25, 0.35, 0.25])[0]\n\n    # 是否午睡及午睡时长\n    nap = random.choices([True, False], weights=[0.45, 0.55])[0]\n    nap_duration = round(random.gauss(30, 20)) if nap else 0\n    nap_duration = max(0, min(120, nap_duration))\n\n    # 运动频率\n    exercise = random.choices(exercise_freq, weights=[0.25, 0.35, 0.25, 0.15])[0]\n\n    # 咖啡因\n    caffeine = round(random.gauss(2.0, 1.5), 1)\n    caffeine = round(max(0, min(8, caffeine)), 1)\n\n    # 压力水平\n    stress = random.choices(range(1, 11), weights=[2,3,5,8,10,10,8,5,3,2])[0]\n    # 压力高 → 睡眠质量差\n    if stress >= 7 and random.random() < 0.5:\n        quality = max(1, quality - random.randint(1, 2))\n\n    # 屏幕时间（睡前）\n    screen = round(random.gauss(2.5, 1.3), 1)\n    screen = round(max(0, min(6, screen)), 1)\n\n    # BMI\n    bmi = round(random.gauss(23.5, 4.0), 1)\n    bmi = round(max(16.0, min(38.0, bmi)), 1)\n\n    # 睡眠障碍\n    if random.random() < 0.30:\n        disorder = random.choice(disorder_list[1:])  # 有障碍\n    else:\n        disorder = '无'\n\n    occupation = random.choice(occupations)\n\n    # 构建行\n    row = [sid, age, sex, sleep_hours, bedtime, wakeup, quality,\n           '是' if nap else '否', nap_duration, exercise, caffeine,\n           stress, screen, disorder, occupation, bmi]\n\n    # 注入 NaN\n    for j, (col, prob) in enumerate(zip(nan_cols.keys(), nan_cols.values())):\n        if random.random() < prob:\n            nan_counts[col] += 1\n            # 找到对应列索引\n            col_map = {'年龄': 1, '睡眠时长_小时': 3, '睡眠质量评分_1_10': 6,\n                       '入睡时间': 4, '起床时间': 5, '午睡时长_分钟': 8,\n                       '运动频率': 9, '咖啡因_杯_天': 10, '压力水平_1_10': 11,\n                       '屏幕时间_睡前_小时': 12, 'BMI': 15}\n            row[col_map[col]] = 'NaN'\n\n    rows.append(row)\n\n# 写入\nheader = ['编号', '年龄', '性别', '睡眠时长_小时', '入睡时间', '起床时间',\n          '睡眠质量评分_1_10', '是否午睡', '午睡时长_分钟', '运动频率',\n          '咖啡因_杯_天', '压力水平_1_10', '屏幕时间_睡前_小时',\n          '睡眠障碍', '职业', 'BMI']\n\nwith open('sleep_survey.csv', 'w', newline='', encoding='utf-8-sig') as f:\n    writer = csv.writer(f)\n    writer.writerow(header)\n    writer.writerows(rows)\n\n# 统计\nfrom collections import Counter\nsex_cnt = Counter(r[2] for r in rows)\nquality_dist = Counter(r[6] for r in rows if r[6] != 'NaN')\nocc_cnt = Counter(r[14] for r in rows)\n\nprint(f'✅ 已生成 {len(rows)} 条睡眠调查数据 → sleep_survey.csv')\nprint()\nprint('📊 数据摘要:')\nprint(f'   性别: 男={sex_cnt[\\\"男\\\"]}, 女={sex_cnt[\\\"女\\\"]}')\nprint(f'   年龄范围: 18-65')\nprint(f'   睡眠时长: 3.0-10.0 小时')\nprint(f'   睡眠质量分布: {dict(sorted(quality_dist.items()))}')\nprint()\nprint('🔢 NaN 分布:')\ntotal_nan = 0\nfor k, v in nan_counts.items():\n    print(f'   {k}: {v} 个')\n    total_nan += v\nprint(f'   总计 NaN 单元格: {total_nan} 个')\nprint()\nprint('📋 前8条预览:')\nwith open('sleep_survey.csv', 'r', encoding='utf-8-sig') as f:\n    for i, line in enumerate(f):\n        if i <= 8:\n            print('   ', line.rstrip())\n\")"]
